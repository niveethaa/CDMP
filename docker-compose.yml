services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "5001:5001"
    environment:
      HOST: 0.0.0.0
      PORT: 5001
      MONGODB_URI: mongodb://mongo:27017/course_project_nacss
      REQUIRE_MONGODB: "true"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: http://localhost:5001/api
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

  data-importer:
    build:
      context: .
      dockerfile: Dockerfile.data
    profiles:
      - tools
    environment:
      MONGODB_URI: mongodb://mongo:27017/course_project_nacss
      DONATION_DATA_DIR: /data/donation/raw
      POSTAL_RIDING_MAPPING_FILE: /data/reference/postal_riding_mappings.csv
    volumes:
      - ./data:/data
      - ./client/public/data/ridings:/app/client/public/data/ridings
    depends_on:
      mongo:
        condition: service_healthy

  mongo-tools:
    image: mongo:8.0
    profiles:
      - tools
    volumes:
      - ./mongo-dump:/dump:ro
    depends_on:
      mongo:
        condition: service_healthy
    command: ["true"]

volumes:
  mongo_data:
